<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treatment | Primary Eye Care</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f0f4f8; color: #1a2c3e; }
        .app-container { max-width: 1400px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }
        .top-bar { background: white; border-bottom: 1px solid #e2e8f0; padding: 0.75rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo-area h2 { font-size: 1.2rem; font-weight: 600; color: #0f3b2c; }
        .logo-area p { font-size: 0.75rem; color: #4a6a7e; }
        .status-area { display: flex; align-items: center; gap: 1.5rem; }
        .not-saved-badge { background: #fff3e0; padding: 0.4rem 1rem; border-radius: 40px; font-size: 0.75rem; font-weight: 600; color: #c47d2e; }
        .action-buttons { display: flex; gap: 0.75rem; }
        .cancel-btn, .save-btn { border: none; padding: 0.45rem 1.2rem; border-radius: 40px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
        .cancel-btn { background: #f1f5f9; color: #4a5b6e; }
        .save-btn { background: #2b6e4f; color: white; }
        .nav-tabs { display: flex; flex-wrap: wrap; background: white; border-bottom: 1px solid #e2edf2; padding: 0 1.5rem; gap: 0.25rem; }
        .tab-btn { background: transparent; border: none; padding: 1rem 1.2rem; font-size: 0.9rem; font-weight: 500; color: #5b7c8e; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #2b6e4f; border-bottom-color: #2b6e4f; font-weight: 600; }
        .tab-content { padding: 1.8rem 2rem; flex: 1; }
        .subsection { background: white; border-radius: 20px; margin-bottom: 2rem; border: 1px solid #e2edf2; }
        .subsection h3 { font-size: 1.3rem; font-weight: 600; padding: 1.2rem 1.5rem 0.6rem 1.5rem; color: #0f4c5f; }
        .form-field { padding: 0.8rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .form-field label { font-weight: 600; font-size: 0.8rem; text-transform: uppercase; color: #2c5a6e; }
        input { border: 1.5px solid #dce7ef; border-radius: 16px; padding: 0.7rem 1rem; font-family: inherit; font-size: 0.9rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .add-button { background: #2b8c6e; border: none; padding: 0.6rem 1.5rem; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; margin: 0 1.5rem 1.5rem 1.5rem; }
        .treatment-item { background: #f9fbfd; margin: 0.5rem 1.5rem; padding: 0.6rem 1rem; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2edf2; }
        .remove-button { background: #fff0f0; border: none; border-radius: 30px; padding: 0.2rem 0.8rem; cursor: pointer; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="top-bar">
        <div class="logo-area"><h2>New Primary Eye Care</h2><p>Ministry Of Health</p></div>
        <div class="status-area"><div class="not-saved-badge" id="statusBadge">⚠️ Not Saved</div><div class="action-buttons"><button class="cancel-btn" onclick="if(confirm('Discard changes?')) location.reload();">Cancel</button><button class="save-btn" onclick="saveTreatment();">Save</button></div></div>
    </div>
    <div class="nav-tabs">
        <button class="tab-btn" onclick="location.href='patientDetails.html'">Patient Details</button>
        <button class="tab-btn" onclick="location.href='consultation.html'">Consultation</button>
        <button class="tab-btn" onclick="location.href='final-diagnosis.html'">Final Diagnosis</button>
        <button class="tab-btn active" onclick="location.href='treatment.html'">Treatment</button>
        <button class="tab-btn" onclick="location.href='consumables.html'">Consumables</button>
        <button class="tab-btn" onclick="location.href='discharge.html'">Discharge</button>
    </div>
    <div class="tab-content">
        <div class="subsection"><h3>Treatment Plan</h3>
            <div class="form-grid">
                <div class="form-field"><label>Medication / Procedure <span class="required">*</span></label><input type="text" id="medName" placeholder="e.g., Ciprofloxacin drops"></div>
                <div class="form-field"><label>Dosage & frequency <span class="required">*</span></label><input type="text" id="dosage" placeholder="1 drop QID"></div>
                <div class="form-field"><label>Duration <span class="required">*</span></label><input type="text" id="duration" placeholder="7 days"></div>
            </div>
            <button class="add-button" id="addBtn">+ Add Treatment</button>
            <div id="treatmentList"></div>
        </div>
    </div>
</div>
<script>
    let treatments = [];
    function markUnsaved() { document.getElementById('statusBadge').innerHTML = '⚠️ Not Saved'; }
    function renderTreatments() {
        const container = document.getElementById('treatmentList');
        if(treatments.length===0) { container.innerHTML = '<p style="margin:1rem 1.5rem; color:#6c8d9e;">No treatments added.</p>'; return; }
        let html = '';
        treatments.forEach((t,i)=> { html+=`<div class="treatment-item"><span><strong>${escapeHtml(t.med)}</strong> — ${escapeHtml(t.dosage)} · ${escapeHtml(t.duration)}</span><button class="remove-button" data-idx="${i}">Remove</button></div>`; });
        container.innerHTML = html;
        document.querySelectorAll('[data-idx]').forEach(btn=>btn.addEventListener('click',()=>{ treatments.splice(parseInt(btn.dataset.idx),1); renderTreatments(); markUnsaved(); }));
    }
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    document.getElementById('addBtn').addEventListener('click',()=>{
        const med = document.getElementById('medName').value.trim();
        const dosage = document.getElementById('dosage').value.trim();
        const duration = document.getElementById('duration').value.trim();
        const errors = [];

        if (!med) errors.push('Medication / Procedure is required.');
        if (!dosage) errors.push('Dosage & frequency is required.');
        if (!duration) errors.push('Duration is required.');

        if (errors.length > 0) {
            alert('Please fix the following fields before adding treatment:\n\n' + errors.join('\n'));
            return;
        }

        treatments.push({med, dosage, duration});
        renderTreatments(); markUnsaved();
        document.getElementById('medName').value=''; document.getElementById('dosage').value=''; document.getElementById('duration').value='';
    });

    function saveTreatment() {
        if (treatments.length === 0) {
            alert('Please add at least one treatment before saving.');
            return;
        }
        document.getElementById('statusBadge').innerHTML = '✓ Saved';
        alert('Treatment plan saved successfully.');
        setTimeout(() => document.getElementById('statusBadge').innerHTML = '⚠️ Not Saved', 2000);
    }

    document.querySelectorAll('input').forEach(i => i.addEventListener('input', markUnsaved));
    renderTreatments();
</script>
</body>
</html>
