<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Diagnosis | Primary Eye Care</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f0f4f8; color: #1a2c3e; }
        .app-container { max-width: 1400px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }
        .top-bar { background: white; border-bottom: 1px solid #e2e8f0; padding: 0.75rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo-area h2 { font-size: 1.2rem; font-weight: 600; color: #0f3b2c; }
        .logo-area p { font-size: 0.75rem; color: #4a6a7e; }
        .status-area { display: flex; align-items: center; gap: 1.5rem; }
        .not-saved-badge { background: #fff3e0; padding: 0.4rem 1rem; border-radius: 40px; font-size: 0.75rem; font-weight: 600; color: #c47d2e; }
        .action-buttons { display: flex; gap: 0.75rem; }
        .cancel-btn, .save-btn { border: none; padding: 0.45rem 1.2rem; border-radius: 40px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
        .cancel-btn { background: #f1f5f9; color: #4a5b6e; }
        .save-btn { background: #2b6e4f; color: white; }
        .nav-tabs { display: flex; flex-wrap: wrap; background: white; border-bottom: 1px solid #e2edf2; padding: 0 1.5rem; gap: 0.25rem; }
        .tab-btn { background: transparent; border: none; padding: 1rem 1.2rem; font-size: 0.9rem; font-weight: 500; color: #5b7c8e; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #2b6e4f; border-bottom-color: #2b6e4f; font-weight: 600; }
        .tab-content { padding: 1.8rem 2rem; flex: 1; }
        .diagnosis-card { background: #fafdff; border-radius: 24px; border: 1px solid #e2edf2; padding: 1rem 1.8rem 1.8rem; max-width: 800px; }
        .diagnosis-badge { background: #eef3f7; padding: 0.2rem 1rem; border-radius: 30px; font-size: 0.75rem; font-weight: 700; display: inline-block; margin-bottom: 1rem; }
        .form-field { padding: 0.8rem 0; display: flex; flex-direction: column; gap: 0.5rem; }
        .form-field label { font-weight: 600; font-size: 0.8rem; text-transform: uppercase; color: #2c5a6e; }
        .required { color: #c73e3e; }
        .invalid-input { border-color: #c73e3e !important; background: #fff4f4; }
        input, textarea { border: 1.5px solid #dce7ef; border-radius: 16px; padding: 0.7rem 1rem; font-family: inherit; font-size: 0.9rem; }
        @media (max-width: 780px) { .top-bar { flex-direction: column; } .nav-tabs { overflow-x: auto; } .tab-content { padding: 1rem; } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="top-bar">
        <div class="logo-area"><h2>New Primary Eye Care</h2><p>Ministry Of Health</p></div>
        <div class="status-area"><div class="not-saved-badge" id="statusBadge">⚠️ Not Saved</div><div class="action-buttons"><button class="cancel-btn" onclick="if(confirm('Discard changes?')) location.reload();">Cancel</button><button class="save-btn" onclick="saveDiagnosis();">Save</button></div></div>
    </div>
    <div class="nav-tabs">
        <button class="tab-btn" onclick="location.href='patientDetails.html'">Patient Details</button>
        <button class="tab-btn" onclick="location.href='consultation.html'">Consultation</button>
        <button class="tab-btn active" onclick="location.href='final-diagnosis.html'">Final Diagnosis</button>
        <button class="tab-btn" onclick="location.href='treatment.html'">Treatment</button>
        <button class="tab-btn" onclick="location.href='consumables.html'">Consumables</button>
        <button class="tab-btn" onclick="location.href='discharge.html'">Discharge</button>
    </div>
    <div class="tab-content">
        <div class="diagnosis-card">
            <div class="diagnosis-badge">🏥 Primary Diagnosis</div>
            <div class="form-field"><label>Diagnosis name <span class="required">*</span></label><input type="text" id="primaryDiag" placeholder="e.g., Diabetic Retinopathy"></div>
            <div class="form-field"><label>Diagnosis code (ICD) <span class="required">*</span></label><input type="text" id="diagCode" placeholder="e.g., H25.1"></div>
            <div class="form-field"><label>Clinical notes / details</label><textarea id="diagNotes" rows="3" placeholder="Additional comments about diagnosis"></textarea></div>
        </div>
    </div>
</div>
<script>
    const inputs = document.querySelectorAll('input, textarea');
    inputs.forEach(i => i.addEventListener('input', () => { document.getElementById('statusBadge').innerHTML = '⚠️ Not Saved'; }));
    function clearDiagnosisValidation() {
        document.querySelectorAll('.invalid-input').forEach(el => el.classList.remove('invalid-input'));
    }

    function saveDiagnosis() {
        clearDiagnosisValidation();
        const nameField = document.getElementById('primaryDiag');
        const codeField = document.getElementById('diagCode');
        const errors = [];

        if (!nameField?.value.trim()) {
            errors.push('Diagnosis name is required.');
            nameField?.classList.add('invalid-input');
        }
        if (!codeField?.value.trim()) {
            errors.push('Diagnosis code is required.');
            codeField?.classList.add('invalid-input');
        }

        if (errors.length > 0) {
            alert('Please complete all required diagnosis fields:\n\n' + errors.join('\n'));
            return;
        }

        const diagnosisData = {
            primary: nameField.value.trim(),
            code: codeField.value.trim(),
            notes: document.getElementById('diagNotes')?.value.trim() || ''
        };

        localStorage.setItem('currentDiagnosis', JSON.stringify(diagnosisData));
        document.getElementById('statusBadge').innerHTML = '✓ Saved';
        alert('Diagnosis saved successfully.');
        setTimeout(() => document.getElementById('statusBadge').innerHTML = '⚠️ Not Saved', 2000);
    }
</script>
</body>
</html>
