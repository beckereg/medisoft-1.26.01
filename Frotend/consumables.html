<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumables | Primary Eye Care</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f0f4f8; color: #1a2c3e; }
        .app-container { max-width: 1400px; margin: 0 auto; background: white; min-height: 100vh; display: flex; flex-direction: column; }
        .top-bar { background: white; border-bottom: 1px solid #e2e8f0; padding: 0.75rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo-area h2 { font-size: 1.2rem; font-weight: 600; color: #0f3b2c; }
        .logo-area p { font-size: 0.75rem; color: #4a6a7e; }
        .status-area { display: flex; align-items: center; gap: 1.5rem; }
        .not-saved-badge { background: #fff3e0; padding: 0.4rem 1rem; border-radius: 40px; font-size: 0.75rem; font-weight: 600; color: #c47d2e; }
        .action-buttons { display: flex; gap: 0.75rem; }
        .cancel-btn, .save-btn { border: none; padding: 0.45rem 1.2rem; border-radius: 40px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
        .cancel-btn { background: #f1f5f9; color: #4a5b6e; }
        .save-btn { background: #2b6e4f; color: white; }
        .nav-tabs { display: flex; flex-wrap: wrap; background: white; border-bottom: 1px solid #e2edf2; padding: 0 1.5rem; gap: 0.25rem; }
        .tab-btn { background: transparent; border: none; padding: 1rem 1.2rem; font-size: 0.9rem; font-weight: 500; color: #5b7c8e; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #2b6e4f; border-bottom-color: #2b6e4f; font-weight: 600; }
        .tab-content { padding: 1.8rem 2rem; flex: 1; }
        .subsection { background: white; border-radius: 20px; margin-bottom: 2rem; border: 1px solid #e2edf2; }
        .subsection h3 { font-size: 1.3rem; font-weight: 600; padding: 1.2rem 1.5rem 0.6rem 1.5rem; color: #0f4c5f; }
        .form-field { padding: 0.8rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .form-field label { font-weight: 600; font-size: 0.8rem; text-transform: uppercase; color: #2c5a6e; }
        input, select { border: 1.5px solid #dce7ef; border-radius: 16px; padding: 0.7rem 1rem; font-family: inherit; font-size: 0.9rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .add-button { background: #2b8c6e; border: none; padding: 0.6rem 1.5rem; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; margin: 0 1.5rem 1.5rem 1.5rem; }
        .consumables-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .consumables-table th { background: #eef3f7; padding: 10px; text-align: left; }
        .consumables-table td { padding: 10px; border-bottom: 1px solid #ecf3f7; }
        .remove-button { background: #fff0f0; border: none; border-radius: 30px; width: 30px; cursor: pointer; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="top-bar">
        <div class="logo-area"><h2>New Primary Eye Care</h2><p>Ministry Of Health</p></div>
        <div class="status-area"><div class="not-saved-badge" id="statusBadge">⚠️ Not Saved</div><div class="action-buttons"><button class="cancel-btn" onclick="if(confirm('Discard changes?')) location.reload();">Cancel</button><button class="save-btn" onclick="saveConsumables();">Save</button></div></div>
    </div>
    <div class="nav-tabs">
        <button class="tab-btn" onclick="location.href='patientDetails.html'">Patient Details</button>
        <button class="tab-btn" onclick="location.href='consultation.html'">Consultation</button>
        <button class="tab-btn" onclick="location.href='final-diagnosis.html'">Final Diagnosis</button>
        <button class="tab-btn" onclick="location.href='treatment.html'">Treatment</button>
        <button class="tab-btn active" onclick="location.href='consumables.html'">Consumables</button>
        <button class="tab-btn" onclick="location.href='discharge.html'">Discharge</button>
    </div>
    <div class="tab-content">
        <div class="subsection"><h3>Add Consumable</h3>
            <div class="form-grid">
                <div class="form-field"><label>Consumable name <span class="required">*</span></label><input type="text" id="consName" placeholder="Eye Patch, Fluorescein strips"></div>
                <div class="form-field"><label>Quantity <span class="required">*</span></label><input type="number" id="consQty" placeholder="Quantity"></div>
                <div class="form-field"><label>Unit <span class="required">*</span></label><select id="consUnit"><option>pieces</option><option>boxes</option><option>bottles</option><option>strips</option></select></div>
            </div>
            <button class="add-button" id="addBtn">+ Add Consumable</button>
            <div id="consumableTableArea"></div>
        </div>
    </div>
</div>
<script>
    let consumables = [];
    function markUnsaved() { document.getElementById('statusBadge').innerHTML = '⚠️ Not Saved'; }
    function renderTable() {
        const area = document.getElementById('consumableTableArea');
        if(consumables.length===0) { area.innerHTML = '<p style="margin:1rem; color:#6c8d9e;">No consumables added.</p>'; return; }
        let html = `<table class="consumables-table"><thead><tr><th>Name</th><th>Quantity</th><th>Date issued</th><th>Action</th></tr></thead><tbody>`;
        consumables.forEach(c=>{ html+=`<tr><td>${escapeHtml(c.name)}</td><td>${c.qty} ${c.unit}</td><td>${c.date}</td><td><button class="remove-btn" data-id="${c.id}">✕</button></td></tr>`; });
        html+=`</tbody></table>`;
        area.innerHTML = html;
        document.querySelectorAll('.remove-btn').forEach(btn=>btn.addEventListener('click',()=>{ consumables=consumables.filter(c=>c.id!=parseInt(btn.dataset.id)); renderTable(); markUnsaved(); }));
    }
    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    document.getElementById('addBtn').addEventListener('click',()=>{
        const name = document.getElementById('consName').value.trim();
        const qty = document.getElementById('consQty').value.trim();
        const unit = document.getElementById('consUnit').value;
        const errors = [];

        if (!name) errors.push('Consumable name is required.');
        if (!qty) errors.push('Quantity is required.');

        if (errors.length > 0) {
            alert('Please fix the following fields before adding consumables:\n\n' + errors.join('\n'));
            return;
        }

        consumables.push({ id: Date.now(), name, qty, unit, date: new Date().toLocaleDateString() });
        renderTable(); markUnsaved();
        document.getElementById('consName').value=''; document.getElementById('consQty').value='';
    });

    function saveConsumables() {
        if (consumables.length === 0) {
            alert('Please add at least one consumable before saving.');
            return;
        }
        document.getElementById('statusBadge').innerHTML = '✓ Saved';
        alert('Consumables saved successfully.');
        setTimeout(() => document.getElementById('statusBadge').innerHTML = '⚠️ Not Saved', 2000);
    }

    document.querySelectorAll('input, select').forEach(i => {
        i.addEventListener('input', markUnsaved);
        i.addEventListener('change', markUnsaved);
    });
    renderTable();
</script>
</body>
</html>
